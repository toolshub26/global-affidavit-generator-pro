<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Affidavit Generator Pro</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

<h1>Global Affidavit Generator Pro</h1>

<select id="country">
<option>India</option>
<option>Pakistan</option>
<option>UAE</option>
<option>USA</option>
<option>UK</option>
</select>

<select id="language">
<option>English</option>
<option>Urdu</option>
<option>Hindi</option>
<option>Arabic</option>
</select>

<input
type="text"
id="fullName"
placeholder="Full Name">

<input
type="text"
id="fatherName"
placeholder="Father / Husband Name">

<input
type="number"
id="age"
placeholder="Age">

<input
type="text"
id="state"
placeholder="State / Province">

<input
type="text"
id="district"
placeholder="District / City">

<input
type="text"
id="address"
placeholder="Address">

<select id="purposeDropdown">
<option>Select Purpose</option>
</select>

<textarea
id="swornStatement"
placeholder="Sworn Statement"></textarea>

<button id="generateBtn">
Generate Affidavit
</button>

<div id="preview"></div>

</div>

<script src="app.js"></script>

</body>
</html>
